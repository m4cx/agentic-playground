name: Agent proposal outcome

# Observes review decisions and the end of a proposal. A merge resolves the issue
# to finished, a close without merge to rejected (FR-033). Nothing here merges,
# approves, or pushes: the workflow only records what a human did.

on:
  pull_request:
    types: [closed, review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-issue-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  outcome:
    name: Record proposal outcome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout default branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Prepare run
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node dist/src/agent/main.js prepare

      - name: Record outcome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node dist/src/agent/main.js proposal
