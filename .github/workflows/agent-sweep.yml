name: Agent sweep

# Reconciles interrupted runs and repairs half-applied state-label changes
# (invariant I5). Dry run is available for operators.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be repaired without changing anything
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Reconcile agent state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout default branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build

      - name: Reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_DRY_RUN: ${{ inputs.dry_run }}
        run: node dist/src/agent/main.js sweep
